name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;27.2.12479018"

      - name: Build NLLB offline engine (ARM64)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/llama-nllb"
          git clone --depth 1 https://github.com/Acceldium/llama.cpp.git "$RUNNER_TEMP/llama-nllb"
          cd "$RUNNER_TEMP/llama-nllb"
          git fetch --depth 1 origin 93a155d
          git checkout --detach 93a155d

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S . -B build-android -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-26             -DANDROID_STL=c++_static             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_CXX_STANDARD=17             -DGGML_OPENMP=OFF             -DGGML_NATIVE=OFF             -DLLAMA_CURL=OFF             -DLLAMA_BUILD_TESTS=OFF             -DLLAMA_BUILD_SERVER=OFF

          cmake --build build-android --target nllb-simple --parallel 2
          BIN="$RUNNER_TEMP/llama-nllb/build-android/bin/nllb-simple"
          test -x "$BIN"
          file "$BIN"
          mkdir -p app/src/main/assets
          cp "$BIN" app/src/main/assets/nllb-simple
          chmod 700 app/src/main/assets/nllb-simple
          ls -lh app/src/main/assets/nllb-simple

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medical-book-translator-debug-v1.12.1-fixed
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare and verify stable signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Stable signing is mandatory. All four Android signing secrets must be configured."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/medical-book-translator-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          EXPECTED_CERT_SHA256="BAAC5E5380BA5F9B5CB1E2817662CCD576C5F34035C1C11473365539CC0B10F4"
          ACTUAL_CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"

          if [ -z "$ACTUAL_CERT_SHA256" ]; then
            echo "::error::Could not read the release signing certificate."
            exit 1
          fi

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Wrong signing keystore/certificate. Refusing to build a release APK."
            exit 1
          fi

          echo "Stable signing certificate verified."
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build Stable Release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/medical-book-translator-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify stable release APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          EXPECTED_CERT_SHA256="BAAC5E5380BA5F9B5CB1E2817662CCD576C5F34035C1C11473365539CC0B10F4"
          ACTUAL_APK_CERT_SHA256="$(apksigner verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(":", "", $2); print toupper($2); exit}')"
          test -n "$ACTUAL_APK_CERT_SHA256"
          test "$ACTUAL_APK_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          sha256sum "$APK"


      - name: Upload Stable Release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: medical-book-translator-stable-v1.12.1
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
