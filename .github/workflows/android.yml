name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK for offline NLLB engine
        uses: android-actions/setup-android@v4
      - name: Build NLLB Android native engine
        shell: bash
        run: |
          sdkmanager "ndk;29.0.14206865"
          export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build llama-build --config Release -j 2
          echo "Available llama.cpp binaries:"
          find llama-build -type f -perm -111 | head -80
          test -f llama-build/bin/llama-run
          mkdir -p app/src/main/assets
          cp llama-build/bin/llama-run app/src/main/assets/nllb-simple
          chmod 755 app/src/main/assets/nllb-simple

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medical-book-translator-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
