name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK for offline NLLB engine
        uses: android-actions/setup-android@v4
      - name: Build NLLB Android native engine
        shell: bash
        run: |
          sdkmanager "ndk;29.0.14206865"
          export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          # NLLB PR #18359 is authored in Acceldium/llama.cpp.
          # Checkout that repository directly so all 38 PR files are present.
          git clone --depth 1 https://github.com/Acceldium/llama.cpp.git llama.cpp
          test -f llama.cpp/examples/nllb-translation/nllb-simple.cpp
          # Build the NLLB example directly through a small wrapper project.
          # This avoids relying on a top-level CMake target that the PR does not register.
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(nllb_android LANGUAGES C CXX)
          add_subdirectory(llama.cpp llama)
          add_executable(nllb-simple llama.cpp/examples/nllb-translation/nllb-simple.cpp)
          target_link_libraries(nllb-simple PRIVATE llama)
          target_include_directories(nllb-simple PRIVATE llama.cpp/include llama.cpp/src)
          set_target_properties(nllb-simple PROPERTIES RUNTIME_OUTPUT_DIRECTORY "${CMAKE_BINARY_DIR}/bin")
          EOF
          cmake -S . -B nllb-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build nllb-build --config Release --target nllb-simple --parallel 2
          test -f nllb-build/bin/nllb-simple
          mkdir -p app/src/main/assets
          cp nllb-build/bin/nllb-simple app/src/main/assets/nllb-simple
          chmod 755 app/src/main/assets/nllb-simple

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medical-book-translator-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
